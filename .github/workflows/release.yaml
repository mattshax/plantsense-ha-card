# Publishes a GitHub release for each version tag, so releases come from the repository's automation.
# A pushed tag uses its commit message as the notes. Run by hand to publish an existing tag with given notes;
# "latest" false keeps an older version from becoming the latest release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
      notes:
        description: Release notes
        required: false
        default: ""
      latest:
        description: Mark as the latest release
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          NOTES: ${{ inputs.notes }}
          LATEST: ${{ inputs.latest || 'true' }}
        run: |
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --format=%B "$TAG")"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES" --verify-tag --latest="$LATEST"
